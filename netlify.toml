[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

# /api/strava is declared in the function itself via `export const config`,
# but this keeps it working on older Netlify function runtimes too.
[[redirects]]
  from = "/api/strava"
  to = "/.netlify/functions/strava"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
