<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #16181d;
  --ink-soft: #5b6270;
  --ink-faint: #8c93a1;
  --line: #e6e8ec;
  --card: #fbfbfc;
  --quality: #d1495b;
  --mp: #7b4fa8;
  --long: #2a6fb0;
  --easy: #2f8f5b;
  --group: #0f8a8a;
  --race: #b8860b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 18px 48px; }

header { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 18px; }
h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--ink-soft); font-size: 13px; }
.meta-row { display: flex; gap: 22px; margin-top: 14px; flex-wrap: wrap; }
.meta { min-width: 88px; }
.meta .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
.meta .v { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin-top: 1px; }
.meta .v small { font-size: 12px; font-weight: 400; color: var(--ink-soft); }

.bar { height: 6px; border-radius: 3px; background: #eceef1; overflow: hidden; margin-top: 8px; }
.bar > i { display: block; height: 100%; background: var(--long); border-radius: 3px; transition: width .4s; }

.banner {
  border: 1px solid #f0dcc0; background: #fdf8f0; color: #7a5a20;
  border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 16px;
}
.banner.err { border-color: #f0cfcf; background: #fdf4f4; color: #8a3a3a; }

h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint);
     margin: 26px 0 10px; font-weight: 600; }

.card {
  border: 1px solid var(--line); border-left: 3px solid var(--line);
  border-radius: 8px; background: var(--card);
  padding: 13px 15px; margin-bottom: 9px;
}
.card.next { background: #fff; box-shadow: 0 1px 3px rgba(20,24,32,.06); }
.card-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.when { font-weight: 650; font-size: 15px; }
.rel { font-size: 12px; color: var(--ink-faint); }
.tag {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
  padding: 2px 7px; border-radius: 4px; color: #fff; white-space: nowrap;
}
.dist { margin-left: auto; font-weight: 650; font-size: 15px; white-space: nowrap; }
.title { margin-top: 5px; font-weight: 550; }
.pace { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.detail { margin-top: 6px; font-size: 13.5px; color: var(--ink-soft); }
.gym { display: inline-block; margin-top: 7px; font-size: 11.5px; color: var(--ink-faint);
       border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: #fff; }

.today-card { border-left-width: 4px; padding: 15px 17px; background: #fff;
              box-shadow: 0 1px 3px rgba(20,24,32,.07); margin-bottom: 0; }
.today-card .when { font-size: 17px; letter-spacing: -0.01em; }
.today-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
               color: var(--ink-faint); font-weight: 600; margin-bottom: 9px; }
.today-card .title { margin-top: 4px; }
.rest-card { border-left-color: var(--line); }
.badge-done { background: #eaf6ee; color: #1f6b42; border: 1px solid #cfe8d8;
              font-size: 11.5px; padding: 2px 7px; border-radius: 4px; font-weight: 600;
              white-space: nowrap; }
.yday { font-size: 13.5px; color: var(--ink-soft); margin: 10px 0 0;
        padding: 10px 13px; background: var(--card);
        border: 1px solid var(--line); border-radius: 8px; }
.yday strong { color: var(--ink); font-weight: 650; }
.rest { color: var(--ink-faint); }

.done { display: flex; align-items: baseline; gap: 10px; padding: 8px 2px;
        border-bottom: 1px solid var(--line); font-size: 13.5px; flex-wrap: wrap; }
.done:last-child { border-bottom: 0; }
.done .d { width: 42px; color: var(--ink-faint); font-size: 12px; flex: none; }
.done .n { flex: 1; min-width: 130px; }
.done .a { font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
.tick { color: var(--easy); font-weight: 700; flex: none; }
.cross { color: var(--ink-faint); font-weight: 700; flex: none; }

footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line);
         font-size: 12px; color: var(--ink-faint); }
footer p { margin: 0 0 6px; }
.skel { color: var(--ink-faint); font-size: 13px; padding: 10px 0; }
</style>

  {o:4,k:3, t:"easy",   n:"Shakeout",p:"5:10–5:30",x:"3 km shakeout. Expo, then off your feet. Carb-load day 1."},
  {o:5,k:3, t:"easy",   n:"Pre-race primer",p:"5:10–5:30",x:"3 km + 3×1 min @ MP to wake the legs up. Carb-load day 2. Lay everything out tonight."},
  {o:6,k:42.2,t:"race", n:"VALENCIA MARATHON",p:"4:14",x:"Target 2:59:00. First 5 km at 4:16–4:18, then settle onto 4:14. Gel every 35–40 min from 40 min. Do not bank time."}]}
];

var LABEL = {quality:"Quality", mp:"MP", long:"Long", easy:"Easy", group:"Group", race:"Race"};

/* ---------- date helpers (all local, no UTC drift) ---------- */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(iso){ var p=iso.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(iso,n){ var d=parse(iso); d.setDate(d.getDate()+n); return fmt(d); }
function diff(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function pretty(iso){
  var d=parse(iso);
  return d.toLocaleDateString("en-GB",{weekday:"long"})+" "+d.getDate()+" "+d.toLocaleDateString("en-GB",{month:"short"});
}
function relWord(n){ return n===0?"today":(n===1?"tomorrow":"in "+n+" days"); }
function paceOf(metres, secs){
  if(!metres||!secs) return "";
  var s = secs/(metres/1000);
  return Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
}

/* ---------- flatten plan ---------- */
var SESSIONS = [];
WEEKS.forEach(function(w){
  w.s.forEach(function(s){
    SESSIONS.push({date:addDays(w.mon,s.o), week:w.w, target:w.target, mon:w.mon,
                   km:s.k, type:s.t, name:s.n, pace:s.p, detail:s.x, gym:!!s.g});
  });
});
SESSIONS.sort(function(a,b){ return a.date<b.date?-1:1; });

var TODAY = fmt(new Date());

function currentWeek(){
  var best=null;
  WEEKS.forEach(function(w){
    if(diff(w.mon,TODAY)>=0 && diff(w.mon,TODAY)<=6) best=w;
  });
  if(best) return best;
  if(TODAY < WEEKS[0].mon) return WEEKS[0];
  return WEEKS[WEEKS.length-1];
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function card(s, isFirst, n){
  var col = "var(--"+s.type+")";
  return '<div class="card'+(isFirst?" next":"")+'" style="border-left-color:'+col+'">'
    + '<div class="card-top">'
    +   '<span class="when">'+esc(pretty(s.date))+'</span>'
    +   '<span class="rel">'+relWord(n)+'</span>'
    +   '<span class="tag" style="background:'+col+'">'+LABEL[s.type]+'</span>'
    +   '<span class="dist">'+s.km+' km</span>'
    + '</div>'
    + '<div class="title">'+esc(s.name)+' <span class="pace">· '+esc(s.pace)+'/km</span></div>'
    + '<div class="detail">'+esc(s.detail)+'</div>'
    + (s.gym?'<span class="gym">+ gym</span>':'')
    + '</div>';
}

var BY_DATE = {};
SESSIONS.forEach(function(s){ BY_DATE[s.date] = s; });

function isDone(s, kmByDate){
  var a = kmByDate[s.date];
  return (a && a.km >= 0.6*s.km) ? a : null;
}

/* a planned day with no session: Monday is rest, Tue/Fri are gym, anything else is a gap */
function offDay(iso){
  var dow = parse(iso).getDay();          // 0=Sun … 6=Sat
  if(dow===1) return {label:"Rest day", text:"Nothing planned. Walk, stretch, sleep — this is part of the training."};
  if(dow===2 || dow===5) return {label:"Gym day", text:"No run planned. Strength session, then stay off the legs."};
  return {label:"No session", text:"Nothing scheduled for today."};
}

function bigCard(iso, kmByDate){
  var s = BY_DATE[iso];
  if(!s){
    var o = offDay(iso);
    return '<div class="card today-card rest-card">'
      + '<div class="today-label">Today · '+esc(pretty(iso))+'</div>'
      + '<div class="when">'+o.label+'</div>'
      + '<div class="detail">'+o.text+'</div></div>';
  }
  var col = "var(--"+s.type+")";
  var a = isDone(s, kmByDate);
  return '<div class="card today-card" style="border-left-color:'+col+'">'
    + '<div class="today-label">Today · '+esc(pretty(iso))+'</div>'
    + '<div class="card-top">'
    +   '<span class="when">'+esc(s.name)+'</span>'
    +   '<span class="tag" style="background:'+col+'">'+LABEL[s.type]+'</span>'
    +   (a? '<span class="badge-done">✓ '+a.km.toFixed(1)+' km @ '+paceOf(a.m,a.t)+'/km</span>' : '')
    +   '<span class="dist">'+s.km+' km</span>'
    + '</div>'
    + '<div class="title pace">'+esc(s.pace)+'/km</div>'
    + '<div class="detail">'+esc(s.detail)+'</div>'
    + (s.gym?'<span class="gym">+ gym</span>':'')
    + '</div>';
}

function ydayLine(kmByDate, dataOk){
  var y = addDays(TODAY,-1), s = BY_DATE[y], a = kmByDate[y];
  var dow = parse(y).toLocaleDateString("en-GB",{weekday:"long"});
  var actual = a ? a.km.toFixed(1)+' km @ '+paceOf(a.m,a.t)+'/km'
                 : (dataOk ? 'nothing logged' : 'no data');
  var planned = s ? esc(s.name)+' ('+s.km+' km)' : offDay(y).label.toLowerCase();
  return '<div class="yday"><strong>Yesterday</strong> · '+dow+' — planned '+planned
       + ' &nbsp;→&nbsp; '+actual+'</div>';
}

function render(kmByDate, dataOk, note){
  var wk = currentWeek();

  /* rolling 7-day volume, today included */
  var roll = 0;
  for(var i=6;i>=0;i--){
    var d = addDays(TODAY,-i);
    if(kmByDate[d]) roll += kmByDate[d].km;
  }

  document.getElementById("m-days").innerHTML = Math.max(0,diff(TODAY,RACE))+' <small>days</small>';
  document.getElementById("m-week").innerHTML = 'W'+wk.w+' <small>of 21'+(wk.peak?" · peak":(wk.down?" · down":""))+'</small>';
  document.getElementById("m-km").innerHTML = (dataOk? roll.toFixed(1) : "–")+' <small>/ '+wk.target+' km</small>';
  document.getElementById("m-bar").style.width = Math.min(100, dataOk? roll/wk.target*100 : 0)+"%";

  document.getElementById("today").innerHTML = bigCard(TODAY, kmByDate);
  document.getElementById("yesterday").innerHTML = ydayLine(kmByDate, dataOk);

  var next = SESSIONS.filter(function(s){
    return s.date > TODAY && !isDone(s, kmByDate);
  }).slice(0,4);
  document.getElementById("next").innerHTML = next.length
    ? next.map(function(s,i){ return card(s,false,diff(TODAY,s.date)); }).join("")
    : '<div class="skel">Plan complete. Well run.</div>';

  /* rolling log: the last 7 days, planned against actual */
  var html = "";
  if(dataOk){
    html += '<h2>Last 7 days</h2>';
    for(var j=7;j>=1;j--){
      var d = addDays(TODAY,-j), s = BY_DATE[d], a = kmByDate[d];
      var ok = s ? !!isDone(s, kmByDate) : !!a;
      var name = s ? esc(s.name)+' <span class="pace">('+s.km+' km planned)</span>'
                   : '<span class="rest">'+offDay(d).label.toLowerCase()+'</span>';
      html += '<div class="done">'
        + '<span class="'+(ok?"tick":"cross")+'">'+(ok?"✓":"·")+'</span>'
        + '<span class="d">'+parse(d).toLocaleDateString("en-GB",{weekday:"short"})+'</span>'
        + '<span class="n">'+name+'</span>'
        + '<span class="a">'+(a? a.km.toFixed(1)+' km · '+paceOf(a.m,a.t)+'/km' : (s?'not logged':'—'))+'</span>'
        + '</div>';
    }
  }
  document.getElementById("log-section").innerHTML = html;

  document.getElementById("banner").innerHTML = note
    ? '<div class="banner'+(dataOk?"":" err")+'">'+esc(note)+'</div>' : "";
}

/* ---------- Strava data ----------
   Live from the Netlify function at /api/strava (credentials stay server-side).
   Falls back to the committed data/activities.json snapshot if the function is
   unavailable — e.g. running the page straight off the filesystem.            */
function shape(j, live){
  var days = j.days || {};
  var kmByDate = {};
  Object.keys(days).forEach(function(d){
    kmByDate[d] = {km: days[d].km, m: days[d].km*1000, t: days[d].sec};
  });
  if(j.updated){
    document.getElementById("stamp").textContent =
      "Strava data " + new Date(j.updated).toLocaleString("en-GB") +
      (live ? " · live via Netlify, cached 10 min." : " · offline snapshot.");
  }
  return kmByDate;
}

function loadData(){
  fetch("/api/strava", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ render(shape(j, true), true, null); })
    .catch(function(e){
      console.warn("live Strava fetch failed, falling back to snapshot:", e.message);
      fetch("./data/activities.json?t="+Date.now(), {cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
        .then(function(j){
          var hrs = j.updated ? (Date.now()-new Date(j.updated).getTime())/3600000 : 0;
          render(shape(j, false), true,
            "Live Strava fetch failed — showing a snapshot from " + Math.round(hrs) +
            " hours ago. Check the Netlify function logs if this persists.");
        })
        .catch(function(e2){
          render({}, false, "No Strava data available ("+e2.message+") — showing the plan only, with nothing checked off.");
        });
    });
}

render({}, false, null);
loadData();
</script>
</body>
</html>
